<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Šachy Týnec — aplikace</title>
  <meta name="description" content="Rozcestník aplikací provozovaných pod doménou sachytynec.cz" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --board: #2e4a34;        /* tmavá pole šachovnice (turnajová zeleň) */
      --board-deep: #24382a;
      --cream: #ece0c8;        /* světlá pole */
      --paper: #f4ecda;
      --walnut: #6b4f2a;
      --brass: #c8962a;        /* akcent */
      --ink: #1b201a;
      --muted: #6d7268;
      --line: rgba(27, 32, 26, 0.12);
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: clamp(2rem, 5vw, 5rem) clamp(1.25rem, 4vw, 2.5rem) 4rem;
    }

    /* ---- Hlavička ---- */
    .head {
      position: relative;
      padding-bottom: 2.5rem;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--walnut);
      margin: 0 0 1rem;
    }

    .title {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.6rem, 8vw, 5rem);
      line-height: 0.98;
      letter-spacing: -0.015em;
      margin: 0;
      color: var(--ink);
    }

    .title .accent { color: var(--board); }

    .lede {
      margin: 1.25rem 0 0;
      max-width: 46ch;
      color: var(--muted);
      font-size: 1.05rem;
    }

    /* dekorativní minišachovnice v rohu hlavičky */
    .board-motif {
      position: absolute;
      top: 0;
      right: 0;
      width: 96px;
      height: 96px;
      border: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      opacity: 0.9;
    }
    .board-motif i { display: block; }
    .board-motif i.d { background: var(--board); }
    .board-motif i.l { background: var(--cream); }
    @media (max-width: 560px) { .board-motif { display: none; } }

    /* ---- Mřížka aplikací ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
    }

    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 1.6rem 1.5rem 1.7rem;
      background: var(--paper);
      text-decoration: none;
      color: inherit;
      transition: background 0.18s ease, transform 0.18s ease;
      isolation: isolate;
    }

    .tile:hover, .tile:focus-visible {
      background: #fff;
      outline: none;
    }
    .tile:focus-visible { box-shadow: inset 0 0 0 2px var(--brass); }

    .coord {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--brass);
    }

    .tile h2 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 1.5rem;
      line-height: 1.15;
      margin: 0;
      color: var(--board-deep);
    }

    .tile p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tile .go {
      margin-top: auto;
      padding-top: 0.9rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--walnut);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .tile .go::after {
      content: "→";
      transition: transform 0.18s ease;
    }
    .tile:hover .go::after,
    .tile:focus-visible .go::after { transform: translateX(4px); }

    /* stav / chyba */
    .note {
      grid-column: 1 / -1;
      padding: 2rem 1.5rem;
      background: var(--paper);
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* ---- Patička ---- */
    .foot {
      margin-top: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      align-items: baseline;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .foot .dot { color: var(--brass); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="board-motif" aria-hidden="true"></div>
      <p class="eyebrow">sachytynec.cz</p>
      <h1 class="title">Šachy Týnec<br /><span class="accent">aplikace</span></h1>
      <p class="lede">Rozcestník všech nástrojů provozovaných pod doménou. Vyber, kam chceš.</p>
    </header>

    <section class="grid" id="grid" aria-label="Seznam aplikací">
      <div class="note" id="loading">Načítám aplikace…</div>
    </section>

    <footer class="foot">
      <span><span class="dot">●</span> <span id="count">0</span> aplikací</span>
      <span>app.sachytynec.cz</span>
    </footer>
  </main>

  <script>
    // Souřadnice šachovnice jako pořadové značky dlaždic: a1, b1, … h1, a2, …
    const FILES = ["a", "b", "c", "d", "e", "f", "g", "h"];
    const coord = (i) => FILES[i % 8] + (Math.floor(i / 8) + 1);

    // Dekorativní minišachovnice v rohu hlavičky
    (function motif() {
      const m = document.querySelector(".board-motif");
      for (let i = 0; i < 16; i++) {
        const r = Math.floor(i / 4), c = i % 4;
        const cell = document.createElement("i");
        cell.className = (r + c) % 2 === 0 ? "l" : "d";
        m.appendChild(cell);
      }
    })();

    function render(apps) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      if (!Array.isArray(apps) || apps.length === 0) {
        grid.innerHTML = '<div class="note">Zatím tu nejsou žádné aplikace. Přidej je do <code>apps.json</code>.</div>';
        return;
      }
      apps.forEach((app, i) => {
        const a = document.createElement("a");
        a.className = "tile";
        a.href = app.url;
        a.innerHTML = `
          <span class="coord">${coord(i)}</span>
          <h2>${escapeHtml(app.name || "Bez názvu")}</h2>
          <p>${escapeHtml(app.desc || "")}</p>
          <span class="go">Otevřít</span>
        `;
        grid.appendChild(a);
      });
      document.getElementById("count").textContent = apps.length;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    fetch("apps.json", { cache: "no-cache" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(() => {
        document.getElementById("grid").innerHTML =
          '<div class="note">Nepodařilo se načíst <code>apps.json</code>. Na Cloudflare Pages to poběží; lokálně otevři přes malý server, ne přes file://.</div>';
      });
  </script>
</body>
</html>
